name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate version and project
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          node - "$version" <<'NODE'
          const fs = require('node:fs');
          const expected = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (manifest.version !== expected || pkg.version !== expected) {
            throw new Error(`Tag ${expected} does not match manifest ${manifest.version} and package ${pkg.version}`);
          }
          NODE
          npm test

      - name: Build release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          archive="dist/ChatGPT_Chat_Manager_${version}.zip"
          (cd extension && zip -qr "../$archive" .)
          unzip -p "$archive" manifest.json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const manifest = JSON.parse(input);
              if (manifest.version !== process.argv[1]) process.exit(1);
            });
          ' "$version"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          title="ChatGPT 聊天白名单助手 v${version}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$title" --generate-notes
          fi
