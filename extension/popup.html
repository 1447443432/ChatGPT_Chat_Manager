<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊天白名单助手</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header><div><strong>ChatGPT 聊天白名单</strong><small><span id="versionLabel"></span> · 打开时自动获取当前聊天</small></div><div class="headerActions"><button id="resizePopup" aria-pressed="false">放大</button><button id="scan" class="primary">重新获取</button></div></header>
  <div id="stats" aria-live="polite">请先在 ChatGPT 页面扫描</div>
  <nav aria-label="功能区域">
    <button class="tab active" data-panel="chatsPanel" aria-selected="true">聊天 <span id="count">0</span></button>
    <button class="tab" data-panel="projectsPanel" aria-selected="false">项目 <span id="projectCount">0</span></button>
    <button id="whitelistToggle" class="tab" data-panel="whitelistPanel" aria-selected="false">保护清单 <span id="whitelistCount">0</span></button>
    <button class="tab" data-panel="deletePanel" aria-selected="false">待删除 <span id="deleteCount">0</span></button>
    <button id="screenshot" class="tab" data-panel="screenshotPanel" aria-selected="false">截图</button>
  </nav>
  <main>
    <section id="chatsPanel" class="panel">
      <div class="sectionTitle"><div><b>已扫描聊天</b><small>勾选保护；可批量整理项目或加入待删除</small></div><button id="export">导出 CSV</button></div>
      <div class="projectOrganizer bulkOrganizer"><div class="projectOrganizerHead"><div><b>批量处理</b><span id="moveSelectionSummary">可选择本页或全部搜索结果</span></div><button id="moveModeToggle" type="button">手动选择</button></div><div class="projectSelectActions quickSelect"><button id="selectMovePage" type="button">全选本页</button><button id="selectMoveMatches" type="button">全选搜索结果</button><button id="clearMoveSelection" type="button">清空</button></div><div id="moveToolbar" class="bulkToolbar" hidden><label class="moveTargetLabel" for="bulkAction">批量操作</label><select id="bulkAction" aria-label="选择批量操作"><option value="">请选择操作</option><option value="protect">加入保护清单</option><option value="delete">加入待删除</option><option value="project">整理项目</option></select><div id="projectMoveOptions" hidden><label class="moveTargetLabel" for="moveTarget">目标项目</label><select id="moveTarget" aria-label="选择目标项目或移出项目"><option value="">请选择目标项目或操作</option><option value="__remove_from_project__">移出项目（移回普通聊天）</option></select><button id="showProjectCreate" class="linkButton" type="button">＋ 新建项目</button><div id="projectCreateForm" class="projectCreateRow" hidden><input id="newProjectName" type="text" maxlength="80" placeholder="新项目名称" aria-label="新项目名称"><button id="createProject" type="button">创建项目</button><button id="cancelCreateProject" type="button">取消</button></div></div><div class="projectMoveActions"><button id="moveStart" class="primary" type="button" disabled>执行操作</button><button id="moveStop" type="button" disabled>停止</button></div><div id="moveStatus" role="status"></div></div></div>
      <div class="chatSearch"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.7"></circle><path d="m13 13 4 4"></path></svg><input id="chatSearch" type="search" placeholder="搜索聊天标题或 ID" autocomplete="off" spellcheck="false" aria-label="搜索聊天标题或 ID"><span id="searchSummary" aria-live="polite"></span><button id="clearChatSearch" type="button" aria-label="清除搜索" title="清除搜索" hidden>×</button></div>
      <div id="list" class="rows"></div>
      <div class="paginationBar"><div class="pager"><label for="pageSize">每页</label><input id="pageSize" type="number" min="1" max="100" value="10" inputmode="numeric"><span>条</span><span id="pageSummary" class="pageSummary">共 0 条</span></div>
      <div class="pageButtons"><button id="firstPage" title="首页" aria-label="首页">«</button><button id="prevPage" title="上一页" aria-label="上一页">‹</button><label for="pageInput">第</label><input id="pageInput" type="number" min="1" value="1" inputmode="numeric" aria-label="跳转到第几页"><span id="pageTotal">/ 0 页</span><button id="nextPage" title="下一页" aria-label="下一页">›</button><button id="lastPage" title="末页" aria-label="末页">»</button></div></div>
      <details class="keywordSettings"><summary>按标题关键词保留</summary><label for="keywords">关键词</label><textarea id="keywords" rows="2" placeholder="每行一个，或用逗号分隔"></textarea><button id="saveWords">保存关键词</button></details>
    </section>
    <section id="projectsPanel" class="panel" hidden>
      <div class="sectionTitle"><div><b>项目</b><small>已识别项目默认保护；取消勾选即可解除</small></div></div>
      <div id="projects" class="rows"></div><button id="protectProject">保护当前打开的项目</button>
    </section>
    <section id="whitelistPanel" class="panel" hidden>
      <div class="sectionTitle"><div><b>保护清单</b><small>当前受保护的聊天；来源标签仅作说明</small></div></div>
      <div id="whitelistList" class="rows"></div><button id="reset" class="danger">清空手动保护</button>
    </section>
    <section id="deletePanel" class="panel" hidden>
      <div class="sectionTitle"><div><b>待删除名单</b><small>可从聊天列表逐条添加，或在截图页识别后加入</small></div></div>
      <div id="deleteArea" class="deleteArea"><label for="deleteMode">选择删除范围</label><select id="deleteMode"><option value="selected">待删除名单（我逐条选中的聊天）</option><option value="candidates">全部非保护候选</option></select><p id="deleteHint">重新获取后，可在聊天列表点“待删除”，或从截图识别加入名单。</p><div class="deleteListTitle"><b id="deleteListLabel">本次将删除的聊天</b><span id="deleteListTotal"></span><button id="deleteClear" type="button">清空选中</button></div><div id="deletePreview" class="rows"></div><label class="confirmCheck"><input id="deleteConfirm" type="checkbox"><span>我已核对上方名单，确认删除这些聊天（删除后无法恢复）</span></label><div class="deleteActions"><button id="deleteStart" class="danger" disabled>确认删除</button><button id="deleteStop" disabled>停止</button></div><div id="deleteProgress" role="status"></div></div>
    </section>
    <section id="screenshotPanel" class="panel" hidden>
      <div class="sectionTitle"><div><b>截图识别</b><small>粘贴或上传图片，框选后核对匹配</small></div></div>
      <div class="dropHint">在弹窗中按 Ctrl+V 粘贴截图，或 <label class="fileButton" for="file">选择图片</label><input id="file" type="file" accept="image/*"></div>
      <div id="preview"><canvas id="canvas" hidden></canvas></div>
      <div class="actions"><button id="clear">清除图片与结果</button><button id="recognize" class="primary" disabled>识别截图</button></div>
      <div id="screenshotStatus" role="status"></div><div id="results"></div><div class="screenshotActions"><button id="save" class="primary" hidden>加入手动白名单</button><button id="saveDelete" class="danger" hidden>加入待删除</button></div>
    </section>
  </main>
  <footer><span id="status" role="status">滚动 ChatGPT 侧栏时会同步新加载的聊天；未加载的历史记录仍可能遗漏。</span></footer>
  <div class="resizeHandle top" data-resize="top" title="向上拖动调整高度"></div><div class="resizeHandle left" data-resize="left" title="向左拖动调整宽度"></div><div class="resizeHandle right" data-resize="right" title="拖动调整宽度"></div><div class="resizeHandle bottom" data-resize="bottom" title="拖动调整高度"></div><div class="resizeHandle topLeft" data-resize="top-left" title="拖动调整大小"></div><div class="resizeHandle topRight" data-resize="top-right" title="拖动调整大小"></div><div class="resizeHandle bottomLeft" data-resize="bottom-left" title="拖动调整大小"></div><div class="resizeHandle bottomRight" data-resize="bottom-right" title="拖动调整大小"></div>
  <script src="ocr/tesseract.min.js"></script><script src="popup.js"></script><script src="screenshot.js"></script>
</body></html>
